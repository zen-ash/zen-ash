<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 120" role="img" aria-label="footer">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="80" height="60" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 60" fill="none" stroke="#152238" stroke-width="1"/>
    </pattern>
    <style>
      .mono { font-family: 'Cascadia Code', 'SF Mono', Consolas, Menlo, monospace; }
    </style>
  </defs>

  <rect width="1280" height="120" fill="#0B1120"/>
  <rect width="1280" height="120" fill="url(#grid)"/>

  <path d="M0,55 110,68 220,60 330,78 440,70 550,88 660,80 770,95 880,88 990,100 1100,95 1280,106 L1280,120 0,120 Z" fill="url(#area)"/>
  <polyline points="0,55 110,68 220,60 330,78 440,70 550,88 660,80 770,95 880,88 990,100 1100,95 1280,106"
            fill="none" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>

  <text x="640" y="40" text-anchor="middle" font-size="15" fill="#64748B" class="mono">-- every number above is one I can defend.</text>
</svg>
