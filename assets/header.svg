<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" role="img" aria-label="Aayush Kumar — Data Analyst">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.25" r="0.8">
      <stop offset="0" stop-color="#1E3A8A" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0B1120" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="80" height="60" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 60" fill="none" stroke="#152238" stroke-width="1"/>
    </pattern>
    <style>
      text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'Cascadia Code', 'SF Mono', Consolas, Menlo, monospace; }
    </style>
  </defs>

  <rect width="1280" height="300" fill="#0B1120"/>
  <rect width="1280" height="300" fill="url(#grid)"/>
  <rect width="1280" height="300" fill="url(#glow)"/>

  <line x1="760" y1="250" x2="1240" y2="250" stroke="#1E293B" stroke-width="1"/>
  <g fill="#334155" font-size="11" class="mono" text-anchor="middle">
    <text x="800" y="268">Q1</text><text x="920" y="268">Q2</text><text x="1040" y="268">Q3</text><text x="1160" y="268">Q4</text>
  </g>

  <path d="M760,225 820,205 860,213 920,180 960,192 1020,158 1060,170 1120,132 1160,145 1240,96 L1240,250 760,250 Z" fill="url(#area)"/>
  <polyline points="760,225 820,205 860,213 920,180 960,192 1020,158 1060,170 1120,132 1160,145 1240,96"
            fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="1240" cy="96" r="5" fill="#38BDF8"/>
  <circle cx="1240" cy="96" r="5" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0">
    <animate attributeName="r" values="5;13" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.85;0" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <text x="1238" y="78" text-anchor="end" font-size="12" fill="#38BDF8" class="mono">insight ↑</text>

  <text x="80" y="118" font-size="58" font-weight="700" fill="#F8FAFC">Aayush Kumar</text>
  <text x="83" y="158" font-size="20" font-weight="600" letter-spacing="7" fill="url(#accent)">DATA ANALYST</text>

  <g class="mono" font-size="16">
    <text x="83" y="205" fill="#475569">❯</text>
    <text x="102" y="205" fill="#94A3B8" opacity="1">turning messy data into decisions people can defend<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.3;0.36;1" dur="12s" begin="0s" repeatCount="indefinite"/></text>
    <text x="102" y="205" fill="#94A3B8" opacity="0">A/B testing · operations analytics · KPI dashboards<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.3;0.36;1" dur="12s" begin="4s" repeatCount="indefinite"/></text>
    <text x="102" y="205" fill="#94A3B8" opacity="0">SQL · Python · Tableau · Power BI · dbt<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.3;0.36;1" dur="12s" begin="8s" repeatCount="indefinite"/></text>
  </g>

  <g class="mono" font-size="13">
    <text x="83" y="248" fill="#334155">status:</text>
    <text x="150" y="248" fill="#22C55E">● open to Data / BI Analyst internships</text>
    <text x="475" y="248" fill="#334155">·  Atlanta, GA</text>
    <text x="588" y="248" fill="#94A3B8">▌<animate attributeName="opacity" values="1;0" keyTimes="0;0.5" calcMode="discrete" dur="1.1s" repeatCount="indefinite"/></text>
  </g>
</svg>
